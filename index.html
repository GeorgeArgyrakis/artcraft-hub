<!DOCTYPE html>
<html lang="en" data-theme="artcraft">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtCraft Suite • WebAssembly Creative Hub</title>
  <meta name="description" content="Self-hosted WebAssembly creative suite with automated release synchronization.">

  <!-- Hub Favicon -->
  <link rel="icon" type="image/svg+xml" id="hub-favicon-svg"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 179 150'%3E%3Cpath fill-rule='evenodd' clip-rule='evenodd' d='M77 0H124.6L178.1 116.2L156.6 149.8L130.1 92.3L32.7 148.7L0.1 116.1L77 0ZM100.1 24.3L117 61.4L49.5 100.3L100.1 24.3Z' fill='%234E7BFB'/%3E%3C/svg%3E">
  <link rel="alternate icon" type="image/x-icon" id="hub-favicon-ico" href="/favicon.ico">

  <!-- Immediate Theme Pre-load to prevent visual flash -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('artcraft_hub_theme') || 'artcraft';
        document.documentElement.setAttribute('data-theme', saved === 'glass' ? 'glass' : 'artcraft');
      } catch (e) { }
    })();

    function handleCustomLogoLoad(img) {
      img.style.display = 'block';
      const defaultSvg = document.getElementById('default-logo-svg');
      if (defaultSvg) defaultSvg.style.display = 'none';
      const favSvg = document.getElementById('hub-favicon-svg');
      if (favSvg) favSvg.href = img.src;
    }

    function handleCustomLogoError(img) {
      if (!img.dataset.triedPng) {
        img.dataset.triedPng = 'true';
        img.src = '/assets/logo.png';
      } else {
        img.style.display = 'none';
        const defaultSvg = document.getElementById('default-logo-svg');
        if (defaultSvg) defaultSvg.style.display = 'block';
      }
    }
  </script>

  <!-- Decoupled Stylesheet (served via /assets to prevent Caddy dynamic app rewrites) -->
  <link rel="stylesheet" href="/assets/styles.css">

  <style>
    /* Critical baseline styles to prevent FOUC / layout shift */
    html { background: #0c0d12; color: #f8fafc; }
    .search-icon { width: 14px !important; height: 14px !important; max-width: 14px; max-height: 14px; }
    svg { max-width: 100%; }
  </style>

  <!-- Decoupled Application Logic -->
  <script src="/assets/app.js" defer></script>
</head>

<body>

  <!-- Ambient Glow Background -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
    <div class="ambient-glow-3"></div>
    <div class="ambient-grid"></div>
  </div>

  <!-- Main Shell -->
  <div class="app-shell">

    <!-- Top Navigation Bar -->
    <header class="navbar">
      <a href="/" class="brand-group" aria-label="ArtCraft Hub Home">
        <div class="logo-container">
          <img src="/assets/logo.svg" alt="ArtCraft Logo" class="custom-logo-img" id="custom-logo-img"
            onload="handleCustomLogoLoad(this)" onerror="handleCustomLogoError(this)">
          <svg id="default-logo-svg" class="default-logo-svg" viewBox="0 0 179 150" width="34" height="28" fill="none"
            xmlns="http://www.w3.org/2000/svg" style="display: none;" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M77 0H124.6L178.1 116.2L156.6 149.8L130.1 92.3L32.7 148.7L0.1 116.1L77 0ZM100.1 24.3L117 61.4L49.5 100.3L100.1 24.3Z"
              fill="#4E7BFB" />
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">
            ArtCraft
            <span class="brand-badge">HUB</span>
          </div>
          <span class="brand-subtitle">WebAssembly Creative Hub</span>
        </div>
      </a>

      <div class="nav-actions">
        <!-- Theme Toggle Switcher -->
        <button class="btn-theme-toggle" id="btn-theme-toggle" title="Switch Theme (ArtCraft Theme / Glass Theme)"
          aria-label="Toggle Theme">
          <svg class="theme-icon-artcraft" viewBox="0 0 179 150" width="14" height="14" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M77 0H124.6L178.1 116.2L156.6 149.8L130.1 92.3L32.7 148.7L0.1 116.1L77 0ZM100.1 24.3L117 61.4L49.5 100.3L100.1 24.3Z" />
          </svg>
          <svg class="theme-icon-glass" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="display: none;" aria-hidden="true">
            <path
              d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" />
          </svg>
          <span id="theme-btn-label">ArtCraft Theme</span>
        </button>

        <!-- Sync Trigger Button -->
        <button class="btn-sync" id="btn-sync-all" title="Synchronize latest releases with GitHub" aria-label="Sync Releases">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
          </svg>
          <span id="btn-sync-label">Sync Releases</span>
        </button>
      </div>
    </header>

    <!-- Controls Toolbar (Search & Filter) — Positioned directly below header -->
    <div class="toolbar-container" role="toolbar" aria-label="Tool Filtering and Search">
      <!-- Category Filter Pills -->
      <div class="category-pills" id="category-pills" role="tablist" aria-label="Categories">
        <button class="filter-pill active" data-category="all" role="tab" aria-selected="true">
          All Tools <span class="pill-count" id="count-all">0</span>
        </button>
        <button class="filter-pill" data-category="pinned" role="tab" aria-selected="false">
          📌 Pinned <span class="pill-count" id="count-pinned">0</span>
        </button>
        <button class="filter-pill" data-category="graphics" role="tab" aria-selected="false">
          Graphics & Photo <span class="pill-count" id="count-graphics">0</span>
        </button>
        <button class="filter-pill" data-category="vector" role="tab" aria-selected="false">
          Vector & Design <span class="pill-count" id="count-vector">0</span>
        </button>
        <button class="filter-pill" data-category="documents" role="tab" aria-selected="false">
          Documents <span class="pill-count" id="count-documents">0</span>
        </button>
        <button class="filter-pill" data-category="cad" role="tab" aria-selected="false">
          3D & CAD <span class="pill-count" id="count-cad">0</span>
        </button>
        <button class="filter-pill" data-category="audio" role="tab" aria-selected="false">
          Audio <span class="pill-count" id="count-audio">0</span>
        </button>
      </div>

      <!-- Instant Search Input -->
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search applications..."
          autocomplete="off" spellcheck="false" aria-label="Search applications">
        <span class="search-shortcut" id="search-shortcut" aria-hidden="true">/</span>
        <button class="search-clear" id="search-clear" title="Clear search" aria-label="Clear search">×</button>
      </div>
    </div>

    <!-- Pinned Section -->
    <section class="section-container" id="pinned-section" style="display: none;" aria-labelledby="pinned-title">
      <!-- Glass Theme Grid Section Header -->
      <div class="grid-section-header">
        <div class="section-heading">
          <h2 class="section-title" id="pinned-title">Pinned</h2>
          <span class="section-badge" id="pinned-badge-count">0</span>
        </div>
      </div>

      <!-- ArtCraft Theme Grid Section Header -->
      <div class="artcraft-subnav-bar">
        <div class="artcraft-subnav-col">
          <span class="artcraft-subnav-num" id="artcraft-pinned-num">01 / PINNED APPS</span>
        </div>
        <div class="artcraft-subnav-col right">
          <span class="artcraft-subnav-meta" id="artcraft-pinned-meta">FAVORITES</span>
        </div>
      </div>

      <div class="apps-grid" id="pinned-grid"></div>
    </section>

    <!-- Main All Tools Section -->
    <section class="section-container" id="main-section" aria-labelledby="main-section-title">
      <!-- Glass Theme Grid Section Header -->
      <div class="grid-section-header">
        <div class="section-heading">
          <h2 class="section-title" id="main-section-title">All Applications</h2>
          <span class="section-badge" id="main-badge-count">0</span>
        </div>
        <div class="grid-count" id="grid-status-count">Loading applications...</div>
      </div>

      <!-- ArtCraft Theme Grid Section Header -->
      <div class="artcraft-lineup-bar">
        <span class="artcraft-lineup-title" id="artcraft-lineup-title">02 / THE LINEUP</span>
        <span class="artcraft-lineup-action" id="artcraft-lineup-action">PICK A CRAFT TO EXPLORE</span>
      </div>

      <div class="apps-grid" id="apps-grid">
        <!-- Skeleton cards shown while loading -->
        <div class="skeleton-card" aria-hidden="true"></div>
        <div class="skeleton-card" aria-hidden="true"></div>
        <div class="skeleton-card" aria-hidden="true"></div>
        <div class="skeleton-card" aria-hidden="true"></div>
        <div class="skeleton-card" aria-hidden="true"></div>
        <div class="skeleton-card" aria-hidden="true"></div>
      </div>
    </section>

    <!-- Suite Footer -->
    <footer class="hub-footer">
      <div class="footer-left">
        <div class="footer-meta-row">
          <span class="footer-meta-item">
            <span aria-hidden="true">🕒</span>
            <span id="footer-last-sync">Last checked: Just now</span>
          </span>
          <span class="footer-meta-item">
            <span aria-hidden="true">🔄</span>
            <span id="footer-cron-schedule">Schedule: Daily at midnight</span>
          </span>
          <span class="footer-meta-item">
            <span aria-hidden="true">📦</span>
            <span id="footer-total-apps">0 apps configured</span>
          </span>
        </div>
      </div>
    </footer>

  </div>

  <!-- Toast Notifications Container -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

</body>

</html>
