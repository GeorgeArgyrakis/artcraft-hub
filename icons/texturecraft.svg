<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="tc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="tc-sphere" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <filter id="tc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tc-grad)"/>
  <g filter="url(#tc-shadow)">
    <!-- 3D PBR Material Sphere with texture pattern grid -->
    <circle cx="64" cy="64" r="36" fill="url(#tc-sphere)"/>
    <!-- Procedural Texture UV wireframe grid overlay -->
    <path d="M64 28 C74 40 78 52 78 64 C78 76 74 88 64 100" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.6"/>
    <path d="M64 28 C54 40 50 52 50 64 C50 76 54 88 64 100" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.6"/>
    <ellipse cx="64" cy="64" rx="36" ry="14" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.6"/>
    <ellipse cx="64" cy="48" rx="31" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
    <ellipse cx="64" cy="80" rx="31" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>
</svg>
