<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="squircle-clip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
    <linearGradient id="soundcraft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Field -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#soundcraft-bg)"/>

  <!-- Content clipped to squircle for edge-bleed -->
  <g clip-path="url(#squircle-clip)">
    <!-- Harmonic Sound Waves radiating from singing beak -->
    <path d="M 68 152 A 75 75 0 0 0 68 208" fill="none" stroke="#efe9dc" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M 44 132 A 110 110 0 0 0 44 228" fill="none" stroke="#efe9dc" stroke-width="14" stroke-linecap="round" opacity="0.7"/>

    <!-- Singing Nightingale Mascot (ArtCraft Woodcut Engraving Style) -->
    <!-- Body Silhouette & Parchment Paper Fill -->
    <path d="M 120 180 
             C 135 150 170 120 220 110 
             C 270 100 320 115 365 145 
             C 410 175 440 220 460 270 
             C 490 345 512 430 512 512 
             L 140 512 
             C 140 450 150 390 170 340 
             C 160 300 135 240 120 180 Z" 
          fill="#efe9dc" stroke="#0b0b0c" stroke-width="12" stroke-linejoin="round"/>

    <!-- Head and Open Singing Beak -->
    <!-- Upper Beak -->
    <path d="M 175 145 L 85 170 L 175 185 Z" fill="#0b0b0c"/>
    <!-- Lower Beak (Open for singing) -->
    <path d="M 175 192 L 105 212 L 175 220 Z" fill="#0b0b0c"/>
    <!-- Mouth Cavity / Throat Interior -->
    <path d="M 175 185 L 140 192 L 175 198 Z" fill="#0d9488"/>

    <!-- Nightingale Eye -->
    <circle cx="230" cy="170" r="22" fill="#0b0b0c"/>
    <circle cx="224" cy="164" r="8" fill="#efe9dc"/>

    <!-- Engraved Head & Crown Feathers -->
    <path d="M 235 120 C 240 135 235 145 225 150" fill="none" stroke="#0b0b0c" stroke-width="7" stroke-linecap="round"/>
    <path d="M 265 125 C 275 140 270 155 255 160" fill="none" stroke="#0b0b0c" stroke-width="7" stroke-linecap="round"/>
    <path d="M 295 138 C 305 152 300 168 285 175" fill="none" stroke="#0b0b0c" stroke-width="7" stroke-linecap="round"/>

    <!-- Throat & Puffed Singing Breast Feathers (Hatching) -->
    <path d="M 185 245 C 195 240 205 245 210 255" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 175 275 C 185 270 198 275 202 288" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 170 305 C 180 300 195 305 200 318" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 180 335 C 192 330 208 335 212 350" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>

    <path d="M 220 255 C 232 250 245 255 250 268" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 215 290 C 228 285 242 290 248 305" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 210 325 C 225 320 240 325 246 340" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>

    <!-- Wing Contour and Layered Primary Feathers -->
    <path d="M 270 240 
             C 320 250 370 290 395 350 
             C 425 420 440 480 445 512" 
          fill="none" stroke="#0b0b0c" stroke-width="14" stroke-linecap="round"/>

    <!-- Wing Feathers Engraving -->
    <path d="M 310 280 C 350 320 375 390 390 460" fill="none" stroke="#0b0b0c" stroke-width="9" stroke-linecap="round"/>
    <path d="M 335 295 C 375 340 400 410 415 480" fill="none" stroke="#0b0b0c" stroke-width="9" stroke-linecap="round"/>
    <path d="M 360 315 C 400 365 425 430 435 500" fill="none" stroke="#0b0b0c" stroke-width="9" stroke-linecap="round"/>

    <!-- Flank Hatching Marks -->
    <path d="M 245 375 C 260 370 275 375 280 390" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 240 410 C 255 405 270 410 275 425" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 235 445 C 250 440 265 445 270 460" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 230 480 C 245 475 260 480 265 495" fill="none" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>