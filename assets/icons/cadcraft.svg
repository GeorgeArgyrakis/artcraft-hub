<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="cadcraft-squircle">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
    <linearGradient id="cadcraft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Field -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#cadcraft-bg)"/>

  <!-- Content clipped to squircle -->
  <g clip-path="url(#cadcraft-squircle)">
    <!-- Blueprint Grid Lines -->
    <g stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.35">
      <line x1="64" y1="0" x2="64" y2="512"/>
      <line x1="128" y1="0" x2="128" y2="512"/>
      <line x1="192" y1="0" x2="192" y2="512"/>
      <line x1="256" y1="0" x2="256" y2="512"/>
      <line x1="320" y1="0" x2="320" y2="512"/>
      <line x1="384" y1="0" x2="384" y2="512"/>
      <line x1="448" y1="0" x2="448" y2="512"/>

      <line x1="0" y1="64" x2="512" y2="64"/>
      <line x1="0" y1="128" x2="512" y2="128"/>
      <line x1="0" y1="192" x2="512" y2="192"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
      <line x1="0" y1="320" x2="512" y2="320"/>
      <line x1="0" y1="384" x2="512" y2="384"/>
      <line x1="0" y1="448" x2="512" y2="448"/>
    </g>

    <!-- Compass Drawing Arc & Center Pivot -->
    <!-- Arc -->
    <path d="M 310 135 A 155 155 0 0 1 465 290" fill="none" stroke="#0b0b0c" stroke-width="16" stroke-linecap="round"/>
    <path d="M 310 135 A 155 155 0 0 1 465 290" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>

    <!-- Compass Center Pivot Point -->
    <circle cx="310" cy="290" r="16" fill="#0b0b0c"/>
    <circle cx="310" cy="290" r="7" fill="#efe9dc"/>

    <!-- Compass Drawing Stylus Head -->
    <circle cx="465" cy="290" r="14" fill="#f97316"/>
    <circle cx="465" cy="290" r="6" fill="#ffffff"/>

    <!-- 45° Drafting Set-Square Ruler -->
    <!-- Outer Triangle with Parchment Fill -->
    <polygon points="90,90 90,422 422,422" fill="#efe9dc" stroke="#0b0b0c" stroke-width="16" stroke-linejoin="round"/>

    <!-- Inner Triangular Cutout Window -->
    <polygon points="145,260 145,372 257,372" fill="#0284c7" stroke="#0b0b0c" stroke-width="14" stroke-linejoin="round"/>
    <!-- Inner Window Grid lines -->
    <g stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.35">
      <line x1="192" y1="260" x2="192" y2="372"/>
      <line x1="145" y1="320" x2="257" y2="320"/>
    </g>

    <!-- Precision Millimeter Tick Marks along Vertical Edge -->
    <line x1="90" y1="120" x2="114" y2="120" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <line x1="90" y1="142" x2="104" y2="142" stroke="#0b0b0c" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="164" x2="114" y2="164" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <line x1="90" y1="186" x2="104" y2="186" stroke="#0b0b0c" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="208" x2="114" y2="208" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <line x1="90" y1="230" x2="104" y2="230" stroke="#0b0b0c" stroke-width="6" stroke-linecap="round"/>
    <line x1="90" y1="252" x2="114" y2="252" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>

    <!-- Precision Millimeter Tick Marks along Bottom Horizontal Edge -->
    <line x1="260" y1="422" x2="260" y2="398" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <line x1="282" y1="422" x2="282" y2="408" stroke="#0b0b0c" stroke-width="6" stroke-linecap="round"/>
    <line x1="304" y1="422" x2="304" y2="398" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <line x1="326" y1="422" x2="326" y2="408" stroke="#0b0b0c" stroke-width="6" stroke-linecap="round"/>
    <line x1="348" y1="422" x2="348" y2="398" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
    <line x1="370" y1="422" x2="370" y2="408" stroke="#0b0b0c" stroke-width="6" stroke-linecap="round"/>
    <line x1="392" y1="422" x2="392" y2="398" stroke="#0b0b0c" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>